<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Healthcare & Patient Monitoring Platform: Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pg:#AAB4D4;--pt:#14141A;--pm:#363D5C;--pc:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#14182B;--pt:#F4F1FC;--pm:#C9CFE0;--pc:#232A44}}
:root[data-theme="dark"]{--pg:#14182B;--pt:#F4F1FC;--pm:#C9CFE0;--pc:#232A44}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--pg)}
*{box-sizing:border-box;margin:0}
body{background:var(--pg);font-family:Outfit,system-ui,sans-serif;color:var(--pt);min-height:100vh;display:flex;gap:56px;align-items:center;justify-content:center;padding:24px;flex-wrap:wrap}
.side{width:340px;display:flex;flex-direction:column;gap:16px}
.side h1{font:600 30px/1.15 Outfit}.side p{color:var(--pm);font-size:15px;line-height:1.5}
.pb{display:flex;gap:10px}.pb button{flex:1;height:48px;border-radius:24px;border:0;font:500 15px Outfit;cursor:pointer;background:#0b0b0f;color:#fff}
.pb button.l{background:#E4DAF8;color:#14141A}
#cap{background:var(--pc);color:var(--pt);border-radius:20px;padding:18px 20px;font-size:19px;font-weight:500;line-height:1.35;min-height:86px}
#dots{display:flex;gap:6px;flex-wrap:wrap}#dots i{width:22px;height:5px;border-radius:3px;background:#8B6FE8;opacity:.25}#dots i.on{opacity:1}
#pw{position:relative;flex:none}
#phone{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #0b0b0f,0 24px 60px rgba(10,12,30,.35);transform-origin:top left;background:#EDE8FA}
.sb{position:absolute;top:0;left:0;right:0;height:50px;padding:16px 30px 0;display:flex;justify-content:space-between;font:600 15px Outfit;z-index:5;pointer-events:none;color:#14141A}
.sb.dk{color:#fff}.isl{position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:32px;border-radius:20px;background:#0b0b0f;z-index:6}
.scr{position:absolute;inset:0;padding:60px 20px 104px;display:flex;flex-direction:column;gap:14px;overflow:auto;background:linear-gradient(180deg,#F4F1FC 0%,#EDE8FA 55%,#E4DAF8 100%);color:#14141A;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scr.dk{background:linear-gradient(180deg,#2A3350,#0E1220);color:#fff}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 2px 14px rgba(107,79,208,.08)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.g{flex:1;min-width:0}
.btn{background:#0b0b0f;color:#fff;border:0;border-radius:100px;height:56px;font:500 16px Outfit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn.l{background:#fff;color:#14141A}.btn.r{background:#EF5560}
.ib{display:grid;place-items:center;border-radius:50%;flex:none}
.tag{font:500 12px Outfit;padding:6px 12px;border-radius:100px;background:#fff;color:#14141A}
.m{color:#6B7185;font-size:13px}h2{font:500 26px/1.15 Outfit}h3{font:500 16px Outfit}
.nav{position:absolute;left:18px;right:18px;bottom:18px;height:64px;border-radius:36px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:space-around;box-shadow:0 6px 24px rgba(107,79,208,.18);z-index:4}
.nav b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#14141A}.nav b.on{background:#E4DAF8}
[data-go],[data-act]{cursor:pointer}
.fld{background:#fff;border-radius:20px;padding:12px 16px}.fld .m{font-size:12px}
.bub{max-width:88%;padding:12px 16px;border-radius:22px;font-size:14px;line-height:1.45;animation:in .3s}
.u{align-self:flex-end;background:#0b0b0f;color:#fff}.a{background:#fff;align-self:flex-start}
.bar{height:8px;background:#EEF1FA;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4C8DF6}
.toast{position:absolute;left:30px;right:30px;bottom:100px;background:#0b0b0f;color:#fff;border-radius:18px;padding:14px 18px;font-size:14px;text-align:center;z-index:9;animation:in .25s}
.ring{position:absolute;inset:0;pointer-events:none}
.dk .m{color:#9AA3C2}#idx{max-height:330px;overflow:auto;display:flex;flex-direction:column;gap:6px;background:var(--pc);border-radius:20px;padding:14px}#idx h4{font:500 12px Outfit;color:var(--pm);margin-top:6px}#idx button{font:500 12px Outfit;border:0;border-radius:100px;padding:7px 12px;background:#EEF1FA;color:#14141A;cursor:pointer}#idx button.on{background:#0b0b0f;color:#fff}
@media (max-width:820px){body{gap:20px}.side{width:100%;max-width:390px}}
</style></head><body>
